<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETRA-ROVER MONITORING SYSTEM</title>
    <link rel="stylesheet" type="text/css"  href="/style.css">
    <script src="/script.js"></script>

</head>
<body>
    <!-- project-brand -->
    <header class="topbar">
    <div class="brand">
        <!-- This is for logo and tittle -->
        <div class="brand-logo">N</div>
        <div>
            <h1>NETRA</h1>
            <p>Robot Mission Control</p>
        </div>
    </div>


    <!--  This for navigation section -->
     <nav>
        <a href="#Dashboard">Dashboard</a>
        <a href="#Fleet">Fleet</a>
        <a href="#Telemetry">Telemetry</a>
        <a href="#Alerts">Alerts</a>
     </nav>


      <!-- Display system status and live clock -->
       <div class="header-right">
        <span class="onile-dot"></span>
        <span>SYSTEM ONLINE</span>
        <strong id="clock">--:--:--</strong>
       </div>


        <!-- This is for dispatch mission button -->
         <button id="dispatch-open" type="button">+Dispatch Mission</button>
         
    </header>
  <main class="page">
    <section class="kpi-grid">
        <article class="kpi-card">
            <span>ROVER ONLINE</span>
            <h1 id="online-count">6\6</h1>
            <p>Active rover units </p>
        </article>
         <article class="kpi-card">
            <span>AVERAGE BATTERY</span>
            <h1 id="average-battery">52%</h1>
            <p>Fleet battery level </p>
        </article>
         <article class="kpi-card">
            <span>OPEN ALERT</span>
            <h1 id="alert">0</h1>
            <p>Requires attention</p>
        </article>
         <article class="kpi-card">
            <span>Distance Today</span>
            <h1 id="distance">14.1 KM</h1>
            <p>Total simulated distance</p>
        </article>
    </section>
  </main>
    

</body>
</html>
